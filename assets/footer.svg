  <title>Let's talk — arink1305@gmail.com</title>
  <style>
    .paper { fill: #F2EFE9; }
    .ink   { fill: #141414; }
    .hair  { stroke: #141414; stroke-opacity: 0.22; }
    .accent { fill: #E45E33; }
    .muted { fill: #141414; fill-opacity: 0.58; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #171310; }
      .ink   { fill: #F0EAE0; }
      .hair  { stroke: #F0EAE0; stroke-opacity: 0.22; }
      .muted { fill: #F0EAE0; fill-opacity: 0.6; }
    }
    .rise { animation: rise 1s cubic-bezier(0.65,0,0.35,1) both; }
    @keyframes rise { from { transform: translateY(118%); } to { transform: translateY(0); } }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .fade { animation: fade 0.8s ease 0.7s both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 2.6s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .grow, .fade, .blink { animation: none; }
      .rise, .grow { transform: none; } .fade { opacity: 1; }
    }
  </style>
